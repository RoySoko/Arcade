<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Arcade 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>What would you like to play?</h1>

    <div class="buttons">
      <!-- Arrow Function -->
      <button onclick="playGuess();">Guessing Game</button>

      <!-- Function Expression -->
      <button onclick="playEightBall();">Consult the Oracle</button>

      <!-- Function Declaration -->
      <button onclick="playBNH();">Bear, Ninja, Hunter</button>
    </div>

    <!-- Only used when the ENTIRE playing session ends -->
    <div id="endZone" class="end-zone" aria-live="polite"></div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
